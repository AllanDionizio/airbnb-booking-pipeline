[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airbnb-booking-pipeline"
version = "0.1.0"
description = "Airbnb host emails (bookings and cancellations) to Postgres."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
airbnb-pipeline = "airbnb_booking_pipeline.cli:main"

[project.optional-dependencies]
# The HTTP service in the container (web.py); the CLI does not need it
web = [
    "flask>=3.1,<4",
    "gunicorn>=23,<27",
]
dev = [
    "airbnb-booking-pipeline[web]",
    "pytest>=9.0",
    "ruff==0.17.1",  # keep in sync with .pre-commit-config.yaml
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airbnb_booking_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
