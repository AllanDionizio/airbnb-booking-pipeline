repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The demo emails keep Airbnb's trailing spaces byte for byte
      - id: trailing-whitespace
        exclude: ^data/sample_inbox/
      - id: end-of-file-fixer
        exclude: ^data/sample_inbox/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Secrets scan on every commit; the full-history scan runs before publishing
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
